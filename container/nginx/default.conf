# Nginx is the HTTPS-only public edge for the single NetProbe container.
# Flask provides pages/API/auth; Nginx does not run monitoring calculations.
# Note: the redirect below uses :8443 as the published host HTTPS port.
# If the Docker host maps a DIFFERENT external port, adjust this redirect.
server {
    listen 80;
    server_name _;
    return 308 https://$host:8443$request_uri;
}
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /config/tls/server.crt;
    ssl_certificate_key /config/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    # Forward browser cookies/headers to the local Gunicorn WSGI listener.
    # Do not proxy this service to an external interface by default.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
